name: rest_client_builder
description: >
  A Clean Architecture code-generation framework for building typed REST API
  clients in Dart and Flutter using annotations and build_runner.
version: 1.4.3
repository: https://github.com/corevantdev/rest_client_builder
homepage: https://github.com/corevantdev/rest_client_builder

environment:
  sdk: ^3.10.0

dependencies:
  # Public annotation / runtime surface
  dio: ^5.11.0
  json_annotation: ^4.12.0
  meta: '>=1.17.0 <2.0.0'

dev_dependencies:
  build_runner: ^2.15.1
  lints: ^6.1.0
  test: ^1.31.1

topics:
  - rest
  - api
  - codegen
  - build-runner
  - clean-architecture
